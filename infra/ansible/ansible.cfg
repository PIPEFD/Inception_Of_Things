[defaults]
inventory = inventory.ini
host_key_checking = False
# Muestra cuánto tarda cada tarea + el total al final -- útil para ver qué
# tarea está corriendo ahora mismo y cuál se atasca en una ejecución larga.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
# La VM se destruye/recrea seguido (ver 'make rebuild'); su host key cambia
# cada vez. Igual que el StrictHostKeyChecking=accept-new del Makefile.
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
