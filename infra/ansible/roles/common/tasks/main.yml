---
# Portado de cloud-1/roles/setup_system — paquetes base del host.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600 # solo refrescar si la última vez fue hace más de 1h

- name: Install essential system packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - net-tools
      - ufw
    state: present

# Defensa en profundidad: el NSG de Azure ya restringe a solo 22, pero un
# firewall local evita que un puerto abierto por error en el NSG (o algo
# que escuche en 0.0.0.0 sin querer) quede expuesto sin una segunda barrera.
- name: Allow SSH before enabling ufw (evita cortar el propio acceso)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Set ufw default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set ufw default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable ufw
  community.general.ufw:
    state: enabled
